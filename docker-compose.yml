services:
  voice-agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - clinic-data:/app/data   # named volume: bookings and call log survive rebuilds
    restart: unless-stopped

volumes:
  clinic-data:
